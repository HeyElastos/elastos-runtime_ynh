#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;

# Canonicalize double slashes. When install_path is "/", YunoHost
# substitutes __PATH__ as "/" so concatenations like __PATH__/apps/
# render as "//apps/" in the YunoHost portal links + any server-
# emitted redirect that prefixes __PATH__. Without this rewrite, the
# user sees https://<domain>//apps/home/ in the address bar even
# though everything still works (nginx merges multiple slashes
# internally). The rewrite collapses leading "//" to "/" with a 301
# so the canonical URL stays clean. Only fires when the request
# actually begins with "//", so installs at /elastos/ are untouched.
if ($request_uri ~ "^//+(.*)$") {
    return 301 /$1;
}

# Port layout for the upstream Elastos Runtime:
#   - __PORT__ (room gateway, started by `elastos room open`):
#       owns the full /api/* surface in v0.3+ — auth/passkey, recovery,
#       provider proxy, capability, browser sessions, apps, capsules.
#       The gateway internally proxies runtime calls to :3000 when
#       needed; the browser-facing endpoints all terminate here.
#   - 3000 (`elastos serve`):
#       internal runtime listener. Only /api/health is browser-facing
#       (the iroh-mesh-status pill polls it). /api/auth/attach is
#       gateway→runtime internal and never crosses nginx.
#
# Per docs/HEY_MODULAR_ARCHITECTURE.md, we let upstream own the port
# split. nginx only forwards /api/health to :3000 explicitly because
# we know that one is runtime-bound; everything else falls through to
# the gateway at :__PORT__, which is also the discovery surface for
# every endpoint v0.3+ adds (and any future endpoints upstream
# introduces in v0.4+).

location __PATH__/api/health {
    proxy_pass http://127.0.0.1:3000/api/health;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 10s;
}

# Public IPFS gateway. Kubo serves /ipfs/<CID> on 127.0.0.1:8080 with
# no auth — CIDs are content-addressed hashes, so possession of the
# CID IS the access token (matches the public-IPFS-gateway semantic).
# Exposed here so <img src="/elastos/ipfs/<CID>"> works without the
# browser needing to send Authorization or X-Capability-Token headers
# that direct image-element fetches can't carry. Capsule code uses
# this for avatar / post-media rendering.
location __PATH__/ipfs/ {
    proxy_pass http://127.0.0.1:8080/ipfs/;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    # Cache content addressing aggressively — CID == immutable bytes.
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Catch-all → the room gateway. Owns the full /api/* + /apps/* + /
# surface in v0.3+. Long timeout for websockets/SSE on chat-room +
# browser sessions; 100 MB max body for capsule storage writes.
location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT__/;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Required for the room gateway's websockets / SSE streams.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_buffering off;
    proxy_read_timeout 86400s;

    client_max_body_size 100M;

    # Subpath cookie scoping. The gateway sets Set-Cookie with Path=/api/...
    # because it doesn't know about YunoHost's __PATH__ prefix. Rewrite the
    # Path attribute as the cookie passes back to the browser so the cookie
    # actually gets sent on subsequent /__PATH__/api/... requests.
    proxy_cookie_path /api/apps/home __PATH__/api/apps/home;
    proxy_cookie_path /api/ __PATH__/api/;
}
