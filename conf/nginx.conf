#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;

# The runtime exposes two listeners on different ports:
#   - __PORT__ (room gateway): /apps/* and /api/apps/*, /api/capsules/*
#   - 3000 (elastos serve)   : /api/localhost/*, /api/provider/*, /api/capability/*
# Route by path prefix so capsules' storage / provider / capability calls
# reach `elastos serve` instead of the gateway (which would 405 them).
location __PATH__/api/localhost/ {
    proxy_pass http://127.0.0.1:3000/api/localhost/;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    client_max_body_size 100M;
}
location __PATH__/api/provider/ {
    proxy_pass http://127.0.0.1:3000/api/provider/;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    client_max_body_size 100M;
}
location __PATH__/api/capability/ {
    proxy_pass http://127.0.0.1:3000/api/capability/;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    client_max_body_size 100M;
}

location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT__/;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Required for the room gateway's websockets / SSE streams.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_buffering off;
    proxy_read_timeout 86400s;

    client_max_body_size 100M;

    # Subpath cookie scoping. The gateway sets Set-Cookie with Path=/api/...
    # because it doesn't know about YunoHost's __PATH__ prefix. Rewrite the
    # Path attribute as the cookie passes back to the browser so the cookie
    # actually gets sent on subsequent /__PATH__/api/... requests.
    proxy_cookie_path /api/apps/home __PATH__/api/apps/home;
    proxy_cookie_path /api/ __PATH__/api/;
}
