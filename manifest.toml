#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "elastos_runtime"
name = "Elastos Runtime"
description.en = "Signed capsules, explicit capabilities, and sovereign local execution"
description.fr = "Capsules signées, capacités explicites, exécution locale souveraine"

version = "0.3.0~ynh1"

maintainers = ["HeyElastos"]

[upstream]
license = "MIT"
code = "https://github.com/HeyElastos/elastos-runtime_ynh"
admindoc = "https://github.com/HeyElastos/elastos-runtime_ynh/blob/main/README.md"

[integration]
yunohost = ">= 11.2"
architectures = ["amd64", "arm64"]
multi_instance = false
ldap = false
sso = false
# Cargo build cache + target/ dominate disk during install; cold build needs
# headroom. Runtime state under $data_dir is small after install.
disk = "5G"
# Cold cargo --release of elastos-server + capsules peaks high.
ram.build = "4G"
ram.runtime = "512M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    # Mount at root so the canonical URL is
    # https://<your-domain>/apps/home/ (matching upstream Elacity's
    # path layout). Operators who run multiple YunoHost apps on the
    # same domain can pick a subpath at install time.
    default = "/"

    [install.init_main_permission]
    help.en = "Who can reach the runtime through the browser. 'visitors' = anyone on your LAN, no login."
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

[resources]
    [resources.sources.main]
    # The yunohost package and the runtime source share this repo. The install
    # script runs `just build` against the unpacked tree.
    #
    # Pinned to a commit (not a moving `main` branch tarball) so the sha256
    # YunoHost 12 requires stays stable. Bump url + sha256 together on every
    # release — yunohost-bot can automate this via `autoupdate.strategy`.
    url = "https://github.com/HeyElastos/elastos-runtime_ynh/archive/2d0d023eaacd46d917056e36c2784179542208bc.tar.gz"
    sha256 = "e102817a983e3584f164c8843cda16b7bb59b7a7fb60108f39de4aa2c43eccde"
    autoupdate.strategy = "latest_github_commit"

    [resources.sources.hey_capsules]
    # The Hey capsule pack — every Hey-specific capsule (hey-social,
    # hey-messenger, blobs/docs/webrtc-signal providers) lives in its
    # own repo so it stays YunoHost-agnostic and can be lifted onto
    # any Elastos Runtime. Install script extracts capsules/* from
    # this tarball into $install_dir/capsules/ alongside upstream's
    # stock capsules. Bump url + sha256 on every Hey-capsule release.
    url = "https://github.com/HeyElastos/Hey-capsule/archive/bc65ec1f6380e8b0fcaacac06bc0e91479d1e5a5.tar.gz"
    sha256 = "5187b2046212cdcbd66c7f5e914f145886b1c5553b99637e2f4db6812bc8a1b5"
    autoupdate.strategy = "latest_github_commit"
    autoupdate.upstream = "https://github.com/HeyElastos/Hey-capsule"
    in_subdir = false

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.data_dir]
    # Runtime state (XDG_DATA_HOME/elastos, capsule rootfs, identities) lives
    # here so it survives upgrades.
    group = "www-data:rwx"

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 8090
    # Port 8090 binds on localhost only — every external request must
    # go through nginx (and therefore through whatever YunoHost SSO
    # permission the operator set on /). Setting `main.exposed = "TCP"`
    # would punch a hole through the firewall and let LAN/internet
    # clients reach the runtime directly on 8090, bypassing SSO and
    # any auth_request gate — defeats `permission update --add admins`.
    # If you genuinely need direct LAN access, re-add `main.exposed =
    # "TCP"` but understand it disables every nginx-side auth layer.

    [resources.apt]
    packages = [
        "ca-certificates",
        "curl",
        "git",
        "python3",
        "openssl",
        "jq",
        "build-essential",
        "pkg-config",
        "libssl-dev",
        "libclang-dev",
        "cmake",
        "qemu-system-x86",
        "qemu-utils",
    ]
